{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expense.css') }}">
{% endblock %}

{% block content %}
<section class="expense-section">
    <div class="expense-container">

        <header class="expense-header">
            <h1 class="expense-title">Add expense</h1>
            <p class="expense-subtitle">Record a new expense to your account.</p>
        </header>

        <div class="expense-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" step="0.01" min="0.01"
                           placeholder="0.00" value="{{ form.amount }}"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category"
                            class="form-input expense-select" required>
                        <option value="" disabled
                                {%- if form.category not in categories %} selected{% endif %}>Choose a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}"
                                {%- if category == form.category %} selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" max="{{ today }}"
                           value="{{ form.date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="expense-optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" maxlength="200"
                           placeholder="e.g. Lunch with friends"
                           value="{{ form.description }}">
                </div>
                <div class="expense-actions">
                    <button type="submit" class="btn-primary">Add expense</button>
                    <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>
{% endblock %}
